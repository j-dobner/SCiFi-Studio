name: Build and verify public preview
on:
  push:
    branches: [release/v22.1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/build.py
      - run: python tools/validate.py
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/smoke.py
      - name: Commit verified standalone to release branch
        if: github.ref == 'refs/heads/release/v22.1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SCiFi-Studio.html
          git diff --cached --quiet || git commit -m "Build verified SCiFi Studio v22.1 standalone"
          git push origin HEAD:release/v22.1
