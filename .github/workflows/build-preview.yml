name: Build and verify public preview
on:
  push:
    branches: [main, release/v22.1]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/build.py
      - run: python tools/validate.py
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/smoke.py
      - name: Upload verified experimental standalone
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SCiFi-Studio-experimental
          path: SCiFi-Studio.html
      - name: Commit verified standalone to release branch
        if: github.ref == 'refs/heads/release/v22.1' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SCiFi-Studio.html
          git diff --cached --quiet || git commit -m "Build verified SCiFi Studio v22.1 standalone"
          git push origin HEAD:release/v22.1
      - name: Commit verified standalone and publish public download
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SCiFi-Studio.html
          git diff --cached --quiet || git commit -m "Build verified SCiFi Studio standalone"
          git push origin HEAD:main
          if gh release view public-preview >/dev/null 2>&1; then
            gh release upload public-preview SCiFi-Studio.html --clobber
          else
            gh release create public-preview SCiFi-Studio.html --target "$(git rev-parse HEAD)" --title "SCiFi Studio public preview" --notes "Verified standalone offline editor. See README for licenses and usage."
          fi
